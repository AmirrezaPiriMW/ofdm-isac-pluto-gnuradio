[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ofdm-isac-pluto"
version = "0.1.0"
description = "Bistatic OFDM integrated sensing and communication (ISAC) with a PlutoSDR and GNU Radio"
authors = [{ name = "Amirreza Piri" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.8", "pyyaml>=5.4", "matplotlib>=3.5"]   # Ubuntu 22.04/24.04 system versions

[project.optional-dependencies]
hardware = ["pyadi-iio>=0.0.17"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["isac"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
